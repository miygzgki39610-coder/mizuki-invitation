<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173c30">
<title>mizuki jewelry | TOKYO EXHIBITION 2026</title>
<style>
:root{--green:#173c30;--green2:#0f2d24;--gold:#b99a60;--ivory:#f8f3e9;--ink:#26342d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{color:var(--ink);background:radial-gradient(ellipse at top,#fffdf8 0%,#f1eadc 75%,#e8decb 100%);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;display:flex;align-items:center;justify-content:center;padding:22px 14px}
.page{width:min(100%,430px);text-align:center}.eyebrow{font:11px/1.8 Georgia,serif;letter-spacing:.28em;color:#7f704f;margin:0 0 22px}
.scene{position:relative;width:100%;height:400px;perspective:1200px;margin:0 auto 24px;cursor:pointer}
.envelope{position:absolute;left:5%;right:5%;bottom:24px;height:245px;background:linear-gradient(145deg,#1c4939,#123126);border:1px solid rgba(185,154,96,.75);border-radius:4px;box-shadow:0 20px 38px rgba(25,40,30,.18)}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.5%,rgba(5,20,14,.24) 50%,transparent 50.6%),linear-gradient(35deg,transparent 49.5%,rgba(5,20,14,.2) 50%,transparent 50.6%)}
.flap{position:absolute;z-index:5;left:0;right:0;top:0;height:58%;transform-origin:top center;transition:transform 1s cubic-bezier(.2,.7,.2,1);background:linear-gradient(145deg,#22513f,#15382b);clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:visible}
.letter{position:absolute;z-index:2;left:10%;right:10%;bottom:42px;min-height:270px;padding:26px 18px 18px;background:linear-gradient(160deg,#fffdf7,#f0e6d4);border:1px solid #d8c7a4;box-shadow:0 5px 20px rgba(0,0,0,.12);transform:translateY(155px);opacity:.15;transition:transform 1.15s cubic-bezier(.18,.72,.18,1) .25s,opacity .7s ease .25s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.monogram{color:var(--gold);font:italic 30px Georgia,serif;margin-bottom:6px}.brand{color:#5c4a2e;font:10px Georgia,serif;letter-spacing:.23em}.invitation{color:#8b7040;font:23px Georgia,serif;letter-spacing:.18em;margin:20px 0 12px}.jp{font-size:13px;letter-spacing:.12em;line-height:2}
.seal{position:absolute;z-index:7;left:50%;top:55%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#f8e8bf;font:italic 25px Georgia,serif;border:1px solid #e0c17c;background:radial-gradient(circle at 35% 28%,#d6b977,#9d783c 65%,#77572c);box-shadow:0 4px 9px rgba(0,0,0,.22);transition:opacity .3s ease,transform .5s ease}
.tap{position:absolute;z-index:8;left:0;right:0;bottom:-5px;color:#766846;font:11px Georgia,serif;letter-spacing:.35em}.tap span{display:block;font-size:9px;letter-spacing:.18em;margin-top:8px}
.details{opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease;pointer-events:none;margin-top:16px}.details h1{font:11px Georgia,serif;letter-spacing:.18em;color:#75603b;margin:0 0 12px;font-weight:normal}.details .date{font:19px Georgia,serif;letter-spacing:.04em;color:var(--green);margin:0 0 7px}.details .time{font:23px Georgia,serif;color:var(--green);margin:0 0 12px}.details .venue{font-size:12px;line-height:1.9;letter-spacing:.05em}.rule{width:44px;height:1px;background:var(--gold);margin:14px auto}
.replay{display:none;margin:20px auto 0;background:transparent;color:#75603b;border:1px solid #bba576;padding:11px 20px;font:11px Georgia,serif;letter-spacing:.1em;cursor:pointer}.hint{font-size:11px;color:#887b62;line-height:1.9;margin-top:18px}
.opened .flap{transform:rotateX(180deg)}.opened .letter{transform:translateY(-40px);opacity:1}.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none}.opened .tap{opacity:0;pointer-events:none}.opened .details{opacity:1;transform:translateY(0);pointer-events:auto}.opened .replay{display:inline-block}
@media(max-width:380px){.scene{height:370px}.envelope{height:220px}.letter{min-height:250px;padding:20px 12px}.details .date{font-size:17px}.details .time{font-size:21px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="page" id="page">
<p class="eyebrow">A SPECIAL INVITATION</p>
<section class="scene" id="scene" aria-label="タップして招待状を開く" role="button" tabindex="0">
<div class="envelope">
<div class="letter">
<div class="monogram">M</div><div class="brand">MIZUKI JEWELRY</div>
<div class="invitation">INVITATION</div>
<div class="jp">特別なひとときを<br>ご一緒できますように</div>
<div class="rule"></div>
<div class="details">
<h1>TOKYO EXHIBITION 2026</h1>
<p class="date" id="date">2026年11月27日（金）</p>
<p class="time" id="time">14:00〜15:50</p>
<div class="venue">会場の詳細は、ご予約確定のお客様へ<br>個別にご案内いたします。</div>
</div>
</div><div class="flap"></div><div class="seal">M</div>
</div>
<div class="tap">TAP TO OPEN<span>招待状を開く</span></div>
</section>
<button class="replay" id="replay" type="button">もう一度見る</button>
<p class="hint" id="hint">封筒をタップして、招待状をご覧ください。</p>
</main>
<script>
const params = new URLSearchParams(window.location.search);
const rawDate = params.get('date');
const rawTime = params.get('time');
const dateEl = document.getElementById('date');
const timeEl = document.getElementById('time');
const weekdays = ['日','月','火','水','木','金','土'];
if (rawDate && /^\d{4}-\d{2}-\d{2}$/.test(rawDate)) {
  const [y,m,d] = rawDate.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  if (dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d) {
    dateEl.textContent = `${y}年${m}月${d}日（${weekdays[dt.getDay()]}）`;
  }
}
if (rawTime && /^\d{1,2}:\d{2}[-〜～]\d{1,2}:\d{2}$/.test(rawTime)) {
  timeEl.textContent = rawTime.replace('-', '〜').replace('～','〜');
}
const page=document.getElementById('page'), scene=document.getElementById('scene'), replay=document.getElementById('replay'), hint=document.getElementById('hint');
function openInvite(){page.classList.add('opened');hint.textContent='ご来場を心よりお待ちしております。'}
function resetInvite(){page.classList.remove('opened');hint.textContent='封筒をタップして、招待状をご覧ください。'}
scene.addEventListener('click',()=>{if(!page.classList.contains('opened'))openInvite()});
scene.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!page.classList.contains('opened')){e.preventDefault();openInvite()}});
replay.addEventListener('click',resetInvite);
</script>
</body>
</html>
